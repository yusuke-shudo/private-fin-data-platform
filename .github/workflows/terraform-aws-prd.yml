name: Terraform Deployment (AWS Prd)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - 'terraform/aws/platform/prd/**'
      - '.github/workflows/terraform-aws-prd.yml'
  push:
    branches: [ main ]
    paths:
      - 'terraform/aws/platform/prd/**'
      - '.github/workflows/terraform-aws-prd.yml'
  workflow_dispatch:

env:
  TARGET_ENV: "prd"

permissions:
  id-token: write
  contents: read

jobs:
  terraform_aws_prd:
    name: Terraform AWS Prd
    runs-on: ubuntu-latest
    environment: prd-infra
    defaults:
      run:
        working-directory: ./terraform/aws/platform/${{ env.TARGET_ENV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-tfstate-access-role
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=arn:aws:s3:ap-northeast-1:${{ vars.AWS_ACCOUNT_ID }}:accesspoint/${{ vars.PROJECT_PREFIX }}-${{ env.TARGET_ENV }}-tfstate-ap" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Plan to AWS Prd
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_env:            ${{ env.TARGET_ENV }}
          TF_VAR_sf_user_arn:    ${{ vars.SF_USER_ARN }}
          TF_VAR_sf_external_id: ${{ vars.SF_EXTERNAL_ID }}

      - name: Terraform Apply to AWS Prd
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -no-color tfplan
        env:
          TF_VAR_env:            ${{ env.TARGET_ENV }}
          TF_VAR_sf_user_arn:    ${{ vars.SF_USER_ARN }}
          TF_VAR_sf_external_id: ${{ vars.SF_EXTERNAL_ID }}
