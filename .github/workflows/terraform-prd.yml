name: Terraform Deployment (Prd)

on:
  workflow_dispatch:
#  # プルリク作成・更新時は「Plan（検証）」を実行
#  pull_request:
#    types: [opened, synchronize, reopened]
#    branches: [ main ]
#    paths:
#      - 'terraform/prd/**'
#  # mainブランチへのマージ（Push）時は「Apply（本番反映）」を実行
#  push:
#    branches: [ main ]
#    paths:
#      - 'terraform/prd/**'

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================
  # プルリク時に動く検証用（Plan）
  # ==========================================
  terraform_prd_plan:
    name: Terraform Prd Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: prd-infra
    defaults:
      run:
        working-directory: ./terraform/prd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-tfstate-access-role
          aws-region: ap-northeast-1

      - name: Mint Snowflake OIDC Token
        run: |
          OIDC_TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=snowflakecomputing.com" \
            | jq -r '.value')
          echo "SNOWFLAKE_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=arn:aws:s3:ap-northeast-1:${{ vars.AWS_ACCOUNT_ID }}:accesspoint/${{ vars.PROJECT_PREFIX }}-prd-tfstate-ap" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Plan to Prd
        run: terraform plan -no-color
        env:
          TF_VAR_sf_organization_name:          ${{ vars.SF_ORGANIZATION_NAME }}
          TF_VAR_sf_account_name:               ${{ vars.SF_ACCOUNT_NAME }}
          SNOWFLAKE_USER:                       "cicd_infra_engineer_user"
          SNOWFLAKE_AUTHENTICATOR:              "WORKLOAD_IDENTITY"
          SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: "OIDC"

  # ==========================================
  # マージ（Push）時に動く本番反映用（Apply）
  # ==========================================
  terraform_prd_apply:
    name: Terraform Prd Apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prd-infra
    defaults:
      run:
        working-directory: ./terraform/prd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-tfstate-access-role
          aws-region: ap-northeast-1

      - name: Mint Snowflake OIDC Token
        run: |
          OIDC_TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=snowflakecomputing.com" \
            | jq -r '.value')
          echo "SNOWFLAKE_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=arn:aws:s3:ap-northeast-1:${{ vars.AWS_ACCOUNT_ID }}:accesspoint/${{ vars.PROJECT_PREFIX }}-prd-tfstate-ap" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Apply to Prd
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_sf_organization_name:          ${{ vars.SF_ORGANIZATION_NAME }}
          TF_VAR_sf_account_name:               ${{ vars.SF_ACCOUNT_NAME }}
          SNOWFLAKE_USER:                       "cicd_infra_engineer_user"
          SNOWFLAKE_AUTHENTICATOR:              "WORKLOAD_IDENTITY"
          SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: "OIDC"
