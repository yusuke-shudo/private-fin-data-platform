name: "⚠️ One-time State Migration"

on:
  workflow_dispatch: # 💡 これを書くと、GitHubの画面に「実行ボタン」が出現します

permissions:
  id-token: write
  contents: read

env:
  TARGET_ENV: "dev"

jobs:
  state_migration:
    runs-on: ubuntu-latest
    environment: dev-infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-tfstate-access-role
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # =========================================================================
      # ① AWS側の台帳から、Snowflakeの記憶を消す
      # =========================================================================
      - name: Migrate AWS State
        run: |
          terraform init \
            -backend-config="bucket=arn:aws:s3:ap-northeast-1:${{ vars.AWS_ACCOUNT_ID }}:accesspoint/${{ vars.PROJECT_PREFIX }}-${{ env.TARGET_ENV }}-tfstate-ap" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          
          # 💡 AWSの台帳からSnowflakeのDBの記憶を消去
          terraform state rm snowflake_database.datalake || true
          terraform state rm snowflake_database.datawarehouse || true
          terraform state rm snowflake_database.datamart || true
        working-directory: ./terraform/aws/${{ env.TARGET_ENV }}

      # =========================================================================
      # ② Snowflake側の台帳から、AWSの記憶を消す
      # =========================================================================
      - name: Migrate Snowflake State
        run: |
          terraform init \
            -backend-config="bucket=arn:aws:s3:ap-northeast-1:${{ vars.AWS_ACCOUNT_ID }}:accesspoint/${{ vars.PROJECT_PREFIX }}-${{ env.TARGET_ENV }}-tfstate-ap" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          
          # 💡 Snowflakeの台帳からAWSのリソースの記憶を消去（念のため || true をつけてエラーでも次へ行くようにします）
          terraform state rm aws_s3_bucket.data_lake || true
          terraform state rm aws_s3_bucket_public_access_block.data_lake || true
          terraform state rm aws_s3_bucket_server_side_encryption_configuration.data_lake || true
          terraform state rm aws_s3_bucket_versioning.data_lake || true
        working-directory: ./terraform/snowflake/${{ env.TARGET_ENV }}
