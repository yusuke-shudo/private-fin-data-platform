name: Terraform Force Unlock

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: '対象環境 (dev または prd)'
        required: true
        type: choice
        options:
          - dev
          - prd
        default: 'dev'
      target_layer:
        description: '対象レイヤー (aws または snowflake)'
        required: true
        type: choice
        options:
          - aws
          - snowflake
        default: 'snowflake'
      lock_id:
        description: 'エラーログに表示された Lock ID'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  unlock:
    name: Run Force Unlock
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_env }}-infra
    defaults:
      run:
        working-directory: ./terraform/${{ github.event.inputs.target_layer }}/${{ github.event.inputs.target_env }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-tfstate-access-role
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=arn:aws:s3:ap-northeast-1:${{ vars.AWS_ACCOUNT_ID }}:accesspoint/${{ vars.PROJECT_PREFIX }}-${{ github.event.inputs.target_env }}-tfstate-ap" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Execute Force Unlock
        run: terraform force-unlock -force ${{ github.event.inputs.lock_id }}
