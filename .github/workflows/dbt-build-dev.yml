name: dbt Parse & Deploy DBT PROJECT (Dev)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-build-dev.yml'
  workflow_dispatch:

env:
  TARGET_ENV: "dev"
  PYTHON_VERSION: "3.12"
  DBT_VERSION: "1.11.11"
  DBT_PROJECT_NAME: "private_fin_data_platform"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  dbt_parse_and_deploy:
    name: dbt Parse & Deploy DBT PROJECT (Dev)
    runs-on: ubuntu-latest
    environment: dev-infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt and dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Install dbt packages
        working-directory: ./dbt
        run: dbt deps

      - name: Mint Snowflake OIDC Token
        run: |
          OIDC_TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=snowflakecomputing.com" \
            | jq -r '.value')
          echo "SNOWFLAKE_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV

      - name: Install Snowflake CLI
        run: |
          pip install --upgrade pip
          pip install snowflake-cli

      - name: Generate Snowflake CLI config.toml
        run: |
          mkdir -p ~/.config/snowflake
          cat > ~/.config/snowflake/config.toml << EOF
          default_connection_name = "default"

          [connections.default]
          account = "${{ format('{0}-{1}', vars.SF_ORGANIZATION_NAME, vars.SF_ACCOUNT_NAME) }}"
          user = "cicd_infra_engineer_user"
          role = "cicd_infra_engineer_role"
          warehouse = "cicd_infra_wh"
          authenticator = "WORKLOAD_IDENTITY"
          workload_identity_provider = "OIDC"
          token = "$SNOWFLAKE_TOKEN"
          database = "COMMON_DB"
          schema = "UTILS"
          EOF
          chmod 600 ~/.config/snowflake/config.toml

      - name: Upload dbt artifacts to Snowflake stage
        run: |
          snow dbt copy ./dbt \
            @common_db.utils.dbt_projects_stage/dbt/ \
            --recursive \
            --overwrite
        env:
          SNOWFLAKE_TOKEN: ${{ env.SNOWFLAKE_TOKEN }}

      - name: Create test DBT PROJECT on Snowflake
        run: |
          snow sql -q "CREATE OR REPLACE DBT PROJECT datawarehouse_db.common.${{ env.DBT_PROJECT_NAME }}_test  FROM '@common_db.utils.dbt_projects_stage/dbt/' DBT_VERSION = '${{ env.DBT_VERSION }}';"
        env:
          SNOWFLAKE_TOKEN: ${{ env.SNOWFLAKE_TOKEN }}

      - name: Run dbt tests on test PROJECT
        run: |
          snow sql -q "EXECUTE DBT PROJECT datawarehouse_db.common.${{ env.DBT_PROJECT_NAME }}_test ARGS = 'test';"
        env:
          SNOWFLAKE_TOKEN: ${{ env.SNOWFLAKE_TOKEN }}

      - name: Create production DBT PROJECT on Snowflake
        run: |
          snow sql -q "CREATE OR REPLACE DBT PROJECT datawarehouse_db.common.${{ env.DBT_PROJECT_NAME }} FROM '@common_db.utils.dbt_projects_stage/dbt/' DBT_VERSION = '${{ env.DBT_VERSION }}';"
        env:
          SNOWFLAKE_TOKEN: ${{ env.SNOWFLAKE_TOKEN }}

      - name: Post deployment results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            let comment = `## dbt Parse & DBT PROJECT Deployment (Dev)\n\n`;
            comment += `**Status:** ✅ Completed\n\n`;
            comment += `**DBT PROJECT Details:**\n`;
            comment += `- Name: ${{ env.DBT_PROJECT_NAME }}\n`;
            comment += `- Database: datawarehouse_db\n`;
            comment += `- Schema: common\n`;
            comment += `- Source: @common_db.utils.dbt_projects_stage/dbt/\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
