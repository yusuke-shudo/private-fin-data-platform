name: dbt Parse & Deploy DBT PROJECT (Dev)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-build-dev.yml'
  workflow_dispatch:

env:
  TARGET_ENV: "dev"
  PYTHON_VERSION: "3.12"
  DBT_VERSION: "1.12.0"
  DBT_PROJECT_NAME: "private_fin_data_platform_dev"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  dbt_parse_and_deploy:
    name: dbt Parse & Deploy DBT PROJECT (Dev)
    runs-on: ubuntu-latest
    environment: dev-data

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt and dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Install dbt packages
        working-directory: ./dbt
        run: dbt deps

      - name: Mint Snowflake OIDC Token
        run: |
          OIDC_TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=snowflakecomputing.com" \
            | jq -r '.value')
          echo "SNOWFLAKE_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV

      - name: Generate dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          private_fin_data_platform:
            target: cicd_dev
            outputs:
              cicd_dev:
                type: snowflake
                account: ${{ format('{0}-{1}', vars.SF_ORGANIZATION_NAME, vars.SF_ACCOUNT_NAME) }}
                user: cicd_data_engineer_user
                authenticator: workload_identity
                workload_identity_provider: OIDC
                token: "{{ env_var('SNOWFLAKE_TOKEN') }}"
                role: cicd_data_engineer_role
                warehouse: cicd_data_wh
                database: DATAWAREHOUSE_DB
                schema: STAGING
                threads: 4
          EOF

      - name: dbt Debug
        working-directory: ./dbt
        run: dbt debug
        env:
          SNOWFLAKE_TOKEN: ${{ env.SNOWFLAKE_TOKEN }}

      - name: dbt Parse (Generate manifest.json)
        working-directory: ./dbt
        run: dbt parse --target cicd_dev
        env:
          SNOWFLAKE_TOKEN: ${{ env.SNOWFLAKE_TOKEN }}

      - name: Install Snowflake CLI
        run: |
          pip install --upgrade pip
          pip install snowflake-cli

      - name: Generate Snowflake CLI config.toml
        run: |
          mkdir -p ~/.config/snowflake
          cat > ~/.config/snowflake/config.toml << EOF
          default_connection_name = "default"

          [connections.default]
          account = "${{ format('{0}-{1}', vars.SF_ORGANIZATION_NAME, vars.SF_ACCOUNT_NAME) }}"
          user = "cicd_data_engineer_user"
          role = "cicd_data_engineer_role"
          warehouse = "cicd_data_wh"
          authenticator = "WORKLOAD_IDENTITY"
          workload_identity_provider = "OIDC"
          token = "$SNOWFLAKE_TOKEN"
          database = "COMMON_DB"
          schema = "UTILS"
          EOF
          chmod 600 ~/.config/snowflake/config.toml

      - name: Upload dbt artifacts to Snowflake stage
        run: |
          snow dbt copy ./dbt \
            @COMMON_DB.UTILS.DBT_PROJECTS_STAGE/dbt_dev/
        env:
          SNOWFLAKE_TOKEN: ${{ env.SNOWFLAKE_TOKEN }}

      - name: Create DBT PROJECT on Snowflake
        run: |
          snow sql -q "CREATE OR REPLACE DBT PROJECT \"DATAWAREHOUSE_DB\".\"STAGING\".\"${{ env.DBT_PROJECT_NAME }}\" FROM '@COMMON_DB.UTILS.DBT_PROJECTS_STAGE/dbt_dev/';"
        env:
          SNOWFLAKE_TOKEN: ${{ env.SNOWFLAKE_TOKEN }}

      - name: Post deployment results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            let comment = `## dbt Parse & DBT PROJECT Deployment (Dev)\n\n`;
            comment += `**Status:** ✅ Completed\n\n`;
            comment += `**DBT PROJECT Details:**\n`;
            comment += `- Name: ${{ env.DBT_PROJECT_NAME }}\n`;
            comment += `- Database: DATAWAREHOUSE_DB\n`;
            comment += `- Schema: STAGING\n`;
            comment += `- Source: @COMMON_DB.UTILS.DBT_PROJECTS_STAGE/dbt_dev/\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
