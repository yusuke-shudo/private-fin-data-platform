name: Terraform Deployment (AWS Dev)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - 'terraform/aws/platform/dev/**'
      - '.github/workflows/terraform-aws-dev.yml'
  workflow_dispatch:

env:
  TARGET_ENV: "dev"
  AWS_REGION: "ap-northeast-1"

permissions:
  id-token: write
  contents: read

jobs:
  terraform_aws_dev:
    name: Terraform AWS Dev Apply
    runs-on: ubuntu-latest
    environment: dev-infra
    defaults:
      run:
        working-directory: ./terraform/aws/platform/${{ env.TARGET_ENV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-tfstate-access-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=arn:aws:s3:${{ env.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:accesspoint/${{ vars.PROJECT_PREFIX }}-${{ env.TARGET_ENV }}-tfstate-ap"

      - name: Terraform Plan to AWS Dev
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          TF_VAR_env:                        ${{ env.TARGET_ENV }}
          TF_VAR_project_prefix:             ${{ vars.PROJECT_PREFIX }}
          TF_VAR_aws_region:                 ${{ env.AWS_REGION }}
          TF_VAR_sf_user_arn:                ${{ vars.SF_USER_ARN }}
          TF_VAR_sf_external_id_accesspoint: ${{ vars.SF_EXTERNAL_ID_ACCESSPOINT }}
          TF_VAR_sf_external_id_direct:      ${{ vars.SF_EXTERNAL_ID_DIRECT }}
          TF_VAR_sf_sqs_arn:                 ${{ vars.SF_SQS_ARN }}

      - name: Terraform Apply to AWS Dev
        run: terraform apply -input=false -no-color tfplan
        env:
          TF_VAR_env:                        ${{ env.TARGET_ENV }}
          TF_VAR_project_prefix:             ${{ vars.PROJECT_PREFIX }}
          TF_VAR_aws_region:                 ${{ env.AWS_REGION }}
          TF_VAR_sf_user_arn:                ${{ vars.SF_USER_ARN }}
          TF_VAR_sf_external_id_accesspoint: ${{ vars.SF_EXTERNAL_ID_ACCESSPOINT }}
          TF_VAR_sf_external_id_direct:      ${{ vars.SF_EXTERNAL_ID_DIRECT }}
          TF_VAR_sf_sqs_arn:                 ${{ vars.SF_SQS_ARN }}

      - name: Upload Terraform debug logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-aws-dev-debug-logs
          path: |
            terraform.log
            crash.log
          if-no-files-found: ignore
