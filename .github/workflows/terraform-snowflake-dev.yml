name: Terraform Deployment (Snowflake Dev)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - 'terraform/snowflake/dev/**'
      - '.github/workflows/terraform-snowflake-dev.yml'
  workflow_dispatch:

env:
  TARGET_ENV: "dev"

permissions:
  id-token: write
  contents: read

jobs:
  terraform_sf_dev:
    name: Terraform Snowflake Dev Apply
    runs-on: ubuntu-latest
    environment: dev-infra
    defaults:
      run:
        working-directory: ./terraform/snowflake/${{ env.TARGET_ENV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC (For S3 Backend)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-tfstate-access-role
          aws-region: ap-northeast-1

      - name: Mint Snowflake OIDC Token
        run: |
          OIDC_TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=snowflakecomputing.com" \
            | jq -r '.value')
          echo "SNOWFLAKE_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=arn:aws:s3:ap-northeast-1:${{ vars.AWS_ACCOUNT_ID }}:accesspoint/${{ vars.PROJECT_PREFIX }}-${{ env.TARGET_ENV }}-tfstate-ap" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Plan to Snowflake Dev
        run: terraform plan -no-color -out=tfplan
        env:
          TF_LOG:                                TRACE
          TF_LOG_PATH:                           terraform.log
          TF_VAR_env:                           ${{ env.TARGET_ENV }}
          TF_VAR_managed_repo:                  ${{ github.repository }}
          TF_VAR_managed_ref:                   ${{ github.sha }}
          TF_VAR_sf_organization_name:          ${{ vars.SF_ORGANIZATION_NAME }}
          TF_VAR_sf_account_name:               ${{ vars.SF_ACCOUNT_NAME }}
          TF_VAR_aws_account_id:                ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_aws_s3_ap_alias:               ${{ vars.AWS_S3_AP_ALIAS }}
          SNOWFLAKE_USER:                       "cicd_infra_engineer_user"
          SNOWFLAKE_AUTHENTICATOR:              "WORKLOAD_IDENTITY"
          SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: "OIDC"

      - name: Terraform Apply to Snowflake Dev
        run: terraform apply -no-color tfplan
        env:
          TF_LOG:                                TRACE
          TF_LOG_PATH:                           terraform.log
          TF_VAR_env:                           ${{ env.TARGET_ENV }}
          TF_VAR_managed_repo:                  ${{ github.repository }}
          TF_VAR_managed_ref:                   ${{ github.sha }}
          TF_VAR_sf_organization_name:          ${{ vars.SF_ORGANIZATION_NAME }}
          TF_VAR_sf_account_name:               ${{ vars.SF_ACCOUNT_NAME }}
          TF_VAR_aws_account_id:                ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_aws_s3_ap_alias:               ${{ vars.AWS_S3_AP_ALIAS }}
          SNOWFLAKE_USER:                       "cicd_infra_engineer_user"
          SNOWFLAKE_AUTHENTICATOR:              "WORKLOAD_IDENTITY"
          SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: "OIDC"

      - name: Upload Terraform debug logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-snowflake-dev-debug-logs
          path: |
            terraform/snowflake/dev/terraform.log
            terraform/snowflake/dev/crash.log
          if-no-files-found: ignore
