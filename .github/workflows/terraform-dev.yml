name: Terraform Deployment (Dev)

on:
  # ★修正：mainへのマージ（push）時ではなく、
  # mainに向けた「プルリクエスト（PR）」の作成・更新時を本番反映のトリガーにします。
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - 'terraform/dev/**'
      - 'terraform/modules/**'

permissions:
  id-token: write
  contents: read

jobs:
  terraform_dev:
    name: Terraform Dev Apply
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./terraform/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-tfstate-access-role
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=arn:aws:s3:ap-northeast-1:${{ vars.AWS_ACCOUNT_ID }}:accesspoint/${{ vars.PROJECT_PREFIX }}-dev-tfstate-ap"

      # ★変更点：マージを待たずに、PRの段階で即座に現在のコードをdev環境に適用（Apply）します。
      # これにより、開発ブランチを更新（push）するたびに、リアルタイムでdev環境が上書き更新されます。
      - name: Terraform Apply to Dev
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_sf_organization_name: ${{ vars.SF_ORGANIZATION_NAME }}
          TF_VAR_sf_account_name:      ${{ vars.SF_ACCOUNT_NAME }}
