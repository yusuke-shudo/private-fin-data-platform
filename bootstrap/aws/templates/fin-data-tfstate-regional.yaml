AWSTemplateFormatVersion: '2010-09-09'
Description: 'Regional Terraform state bucket and S3 Access Point using the existing account-wide GitHub Actions role'

Parameters:
  Environment:
    Type: String
    AllowedValues: ['dev', 'prd']
    Description: 'Target environment name (e.g., dev, prd)'

  ProjectPrefix:
    Type: String
    Default: 'yskshd-fin-data'
    Description: 'Unique prefix for globally unique S3 names'

  GitHubActionsTfstateAccessRoleName:
    Type: String
    Default: 'github-actions-tfstate-access-role'
    Description: 'Existing account-wide GitHub Actions role allowed to access Terraform state'

  GitHubActionsResourceCreationRoleName:
    Type: String
    Default: 'github-actions-resource-creation-role'
    Description: 'Existing account-wide GitHub Actions role for resource creation through the Access Point'

Resources:
  TerraformStateBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketNamePrefix: !Sub '${ProjectPrefix}-${Environment}-tfstate'
      BucketNamespace: account-regional
      ObjectLockEnabled: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TerraformStateAccessPoint:
    Type: 'AWS::S3::AccessPoint'
    Properties:
      Bucket: !Ref TerraformStateBucket
      Name: !Sub '${ProjectPrefix}-${Environment}-tfstate-ap'
      Policy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowGitHubActionsAccess
            Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${GitHubActionsTfstateAccessRoleName}'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${GitHubActionsResourceCreationRoleName}'
            Action:
              - 's3:ListBucket'
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:DeleteObject'
            Resource:
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${ProjectPrefix}-${Environment}-tfstate-ap'
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${ProjectPrefix}-${Environment}-tfstate-ap/object/*'
          - Sid: DenyAllDataOpsExceptGitHubActions
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:DeleteObject'
            Resource:
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${ProjectPrefix}-${Environment}-tfstate-ap/object/*'
            Condition:
              ArnNotEquals:
                'aws:PrincipalArn':
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${GitHubActionsTfstateAccessRoleName}'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${GitHubActionsResourceCreationRoleName}'

  TerraformStateBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyDirectAccessExceptAccessPointAndBootstrap
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${TerraformStateBucket}'
              - !Sub 'arn:aws:s3:::${TerraformStateBucket}/*'
            Condition:
              StringNotEquals:
                's3:DataAccessPointArn': !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${ProjectPrefix}-${Environment}-tfstate-ap'
              StringNotLike:
                'aws:PrincipalArn':
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:root'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_AdministratorAccess_*'
          - Sid: AllowAccessFromAccessPoint
            Effect: Allow
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${TerraformStateBucket}'
              - !Sub 'arn:aws:s3:::${TerraformStateBucket}/*'
            Condition:
              StringEquals:
                's3:DataAccessPointArn': !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${ProjectPrefix}-${Environment}-tfstate-ap'
          - Sid: DenyNonTLSRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${TerraformStateBucket}'
              - !Sub 'arn:aws:s3:::${TerraformStateBucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: EnforceModernTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${TerraformStateBucket}'
              - !Sub 'arn:aws:s3:::${TerraformStateBucket}/*'
            Condition:
              NumericLessThan:
                's3:TlsVersion': 1.2

Outputs:
  S3BucketName:
    Value: !Ref TerraformStateBucket
  S3AccessPointArn:
    Value: !Ref TerraformStateAccessPoint