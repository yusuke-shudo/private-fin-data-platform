name: private_fin_data_platform
version: 1.0.0
config-version: 2

profile: private_fin_data_platform

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  enable_paypay_home_loan_schedule: false

on-run-end:
  - "{{ apply_dbt_object_tags(results) }}"

seeds:
  private_fin_data_platform:
    reference:
      +database: DATAWAREHOUSE_DB
      +schema: REFERENCE
      +quote_columns: false
models:
  private_fin_data_platform:
    staging:
      +database: datawarehouse_db
      +schema: staging
      +materialized: view
    intermediate:
      +database: datawarehouse_db
      +schema: intermediate
      +materialized: ephemeral
    core:
      +database: datawarehouse_db
      +schema: core
      +materialized: table
    semantic_models:
      +database: datawarehouse_db
      +schema: semantic_models
      +materialized: semantic_view
    reports:
      +database: datamart_db
      +schema: reports
      +materialized: table
