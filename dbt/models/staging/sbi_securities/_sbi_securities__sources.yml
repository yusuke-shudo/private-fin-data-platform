version: 2

sources:
  - name: sbi_securities
    description: SBI Securities raw data source
    database: datalake_db
    schema: sbi_securities
    tables:
      - name: sbi_tokutei_profit_loss_report_raw
        description: Raw Tokutei Profit & Loss Report data from SBI Securities (SJIS-encoded CSV)
        meta:
          primary_key: [file_path, line_number]
        columns:
          - name: ingest_at_utc
            description: UTC timestamp when data was ingested into Snowflake
            tests:
              - not_null
          - name: file_path
            description: S3 path of source file
            tests:
              - not_null
          - name: line_number
            description: Line number within source file
            tests:
              - not_null
          - name: raw_text
            description: Raw CSV row as text (unmodified from source)
            tests:
              - not_null
