version: 2

models:
  - name: paypay_home_loan_schedule
    description: "Parsed home loan schedule from DATALAKE raw payload."
    columns:
      - name: payment_date
        tests:
          - not_null
          - unique
      - name: payment_amount
        tests:
          - not_null
      - name: principal_amount
        tests:
          - not_null
      - name: interest_amount
        tests:
          - not_null
      - name: annual_interest_rate
        tests:
          - not_null
      - name: remaining_balance
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null
