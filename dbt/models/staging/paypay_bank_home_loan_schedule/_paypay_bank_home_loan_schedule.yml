version: 2

sources:
  - name: paypay_bank
    description: PayPay Bank raw data source
    database: datalake_db
    schema: paypay_bank
    tables:
      - name: home_loan_schedule_raw
        description: Raw home loan schedule data from PayPay Bank (SJIS-encoded CSV)
        columns:
          - name: ingest_at
            description: Timestamp when data was ingested
            tests:
              - not_null
          - name: file_path
            description: Source file path
            tests:
              - not_null
          - name: line_number
            description: Line number in source file
            tests:
              - not_null
          - name: raw_payload
            description: JSON array containing parsed CSV row
            tests:
              - not_null

