version: 2

models:
  - name: stg_orico_credit__home_reform_loan_schedule
    description: Staging model for Orico Credit home reform loan schedule (Bronze → Silver)
    columns:
      - name: payment_date
        description: Date of payment (支払年月日)
        data_tests:
          - not_null
      - name: payment_amount
        description: Total payment amount (principal + member fee) (返済金額)
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: principal_amount
        description: Principal portion of monthly payment (毎月返済額(元本))
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: interest_amount
        description: Member fee portion of monthly payment (毎月返済額(会員手数料))
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: extra_principal_amount
        description: Extra principal payment (if any) (増額返済額(元本))
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: extra_interest_amount
        description: Extra member fee payment (if any) (増額返済額(会員手数料))
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: annual_interest_rate
        description: Annual interest rate (%) (金利)
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: remaining_balance
        description: Remaining loan balance carried over to next month (翌月繰越残高)
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ingested_at_utc
        description: UTC timestamp when raw data was ingested into Snowflake (データ取込日時(UTC))
        data_tests:
          - not_null
    data_tests:
      - dbt_constraints.primary_key:
          column_name: payment_date
      - dbt_utils.expression_is_true:
          name: check_payment_amount_equals_principal_plus_member_fee
          arguments:
            expression: "payment_amount = principal_amount + interest_amount + COALESCE(extra_principal_amount, 0) + COALESCE(extra_interest_amount, 0)"
