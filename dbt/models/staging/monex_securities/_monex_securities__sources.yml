version: 2

sources:
  - name: monex_securities
    description: MONEX Securities raw data source
    database: datalake_db
    schema: monex_securities
    tables:
      - name: all_trade_and_cash_history_raw
        description: Raw All Trade and Cash History data from MONEX Securities (SJIS-encoded CSV)
        config:
          meta:
            primary_key: [file_path, line_number]
        columns:
          - name: ingested_at_utc
            description: UTC timestamp when data was ingested into Snowflake
            tests:
              - not_null
          - name: file_path
            description: S3 path of source file
            tests:
              - not_null
          - name: line_number
            description: Line number within source file
            tests:
              - not_null
          - name: raw_text
            description: Raw CSV row as text (unmodified from source)
            tests:
              - not_null
