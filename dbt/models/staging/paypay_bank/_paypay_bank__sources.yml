version: 2

sources:
  - name: paypay_bank
    description: PayPay Bank raw data source
    database: datalake_db
    schema: paypay_bank
    tables:
      - name: home_loan_schedule_raw
        description: Raw home loan schedule data from PayPay Bank (SJIS-encoded CSV)
        config:
          meta:
            primary_key: [file_path, line_number]
        columns:
          - name: ingested_at_utc
            description: UTC timestamp when data was ingested into Snowflake
            tests:
              - not_null
          - name: file_path
            description: S3 path of source file
            tests:
              - not_null
          - name: line_number
            description: Line number within source file
            tests:
              - not_null
          - name: raw_text
            description: Raw CSV row as text (unmodified from source)
            tests:
              - not_null
